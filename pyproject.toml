[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinellite-ai"
dynamic = ["version"]
description = "A defensive Linux endpoint monitoring and local alert review prototype."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kavisara Samarakoon" }
]
dependencies = [
    "psutil",
    "PyYAML",
    "rich",
    "typer",
]

[project.scripts]
sentinellite = "sentinellite.main:cli"

[project.optional-dependencies]
dev = [
    "bandit",
    "build",
    "mypy",
    "pip-audit",
    "pytest",
    "ruff",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "sentinellite.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sentinellite.config" = ["default.yaml"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
