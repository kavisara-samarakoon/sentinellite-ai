app:
  name: "SentinelLite AI"
  environment: "development"

monitoring:
  authentication:
    enabled: true
    description: "Scan an explicitly selected authentication log on demand"

  process:
    enabled: true
    description: "Observe the current process list on demand"

  network:
    enabled: true
    description: "Read-only observation of active network connection metadata"

  file_integrity:
    enabled: true
    description: "Observe explicitly selected file paths on demand"

reporting:
  json_reports:
    enabled: true
    output_dir: "reports"

ai_analysis:
  enabled: false
  provider: "none"
  note: "Real AI or LLM execution is not implemented"

risk:
  low: 25
  medium: 50
  high: 75
  critical: 90
