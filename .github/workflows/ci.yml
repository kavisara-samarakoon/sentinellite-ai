name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Packaging, Ruff, and Pytest
    runs-on: ubuntu-latest

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run Ruff
        run: ruff check --no-cache src tests

      - name: Run Pytest
        run: PYTHONDONTWRITEBYTECODE=1 pytest -p no:cacheprovider

      - name: Build wheel
        run: python -m build --wheel

      - name: Validate wheel contents and metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]

          with ZipFile(wheel) as wheel_file:
              names = set(wheel_file.namelist())
              assert any(
                  name.startswith("sentinellite/") and name.endswith(".py")
                  for name in names
              )
              assert "sentinellite/config/default.yaml" in names
              metadata_names = sorted(
                  name for name in names if name.endswith(".dist-info/METADATA")
              )
              entry_point_names = sorted(
                  name
                  for name in names
                  if name.endswith(".dist-info/entry_points.txt")
              )
              assert len(metadata_names) == 1, metadata_names
              assert len(entry_point_names) == 1, entry_point_names
              metadata = wheel_file.read(metadata_names[0]).decode("utf-8")
              entry_points = wheel_file.read(entry_point_names[0]).decode("utf-8")
              assert "Name: sentinellite-ai" in metadata
              assert "Version: 0.9.0a0" in metadata
              assert "sentinellite = sentinellite.main:cli" in entry_points

          print("WHEEL_METADATA_SMOKE: PASSED")
          PY

      - name: Validate wheel in an isolated environment
        run: |
          wheel_path="$(python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          print(wheels[0].resolve())
          PY
          )"
          wheel_environment=/tmp/sentinellite-v09-wheel-environment
          rm -rf "$wheel_environment"
          python -m venv "$wheel_environment"
          "$wheel_environment/bin/python" -m pip install "$wheel_path"

          cd /tmp
          "$wheel_environment/bin/sentinellite" --version
          "$wheel_environment/bin/python" -m sentinellite --version
          "$wheel_environment/bin/sentinellite"

      - name: Validate installed entry points
        run: |
          sentinellite --version
          python -m sentinellite --version

          cd /tmp
          sentinellite
          python -m sentinellite

      - name: Create and use default TOML config
        run: |
          python -m sentinellite config-init --path /tmp/sentinellite.toml
          test -f /tmp/sentinellite.toml
          python -m sentinellite --config /tmp/sentinellite.toml scan-auth examples/auth_logs/sample_auth.log

      - name: Run authentication scan smoke test
        run: |
          console_report_dir=/tmp/sentinellite-v09-console-auth
          rm -rf "$console_report_dir"
          sentinellite scan-auth examples/auth_logs/sample_auth.log --output-dir "$console_report_dir" | tee /tmp/sentinellite-auth-smoke.txt
          grep -Fq "Deterministic Alert Explanations" /tmp/sentinellite-auth-smoke.txt

      - name: Validate Linux authentication log fixture compatibility
        run: |
          ubuntu_report_dir=/tmp/sentinellite-v07-ubuntu-auth
          rhel_report_dir=/tmp/sentinellite-v07-rhel-secure
          rm -rf "$ubuntu_report_dir" "$rhel_report_dir"

          python -m sentinellite auth-sources list
          python -m sentinellite scan-auth examples/auth_logs/sample_ubuntu_auth.log --output-dir "$ubuntu_report_dir"
          python -m sentinellite scan-auth examples/auth_logs/sample_rhel_secure.log --output-dir "$rhel_report_dir"

          python - "$ubuntu_report_dir" "$rhel_report_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected_keys = {
              "report_id",
              "report_type",
              "generated_at",
              "alert_count",
              "alerts",
          }
          for report_dir_value in sys.argv[1:]:
              report_paths = sorted(Path(report_dir_value).glob("*.json"))
              assert len(report_paths) == 1, report_paths
              report = json.loads(report_paths[0].read_text(encoding="utf-8"))
              assert set(report) == expected_keys
              assert report["report_type"] == "sentinellite_alert_report"
              assert report["alert_count"] == 3
              assert len(report["alerts"]) == 3
          PY

          python -m sentinellite reports list --report-dir "$ubuntu_report_dir"
          ubuntu_report_path="$(python - "$ubuntu_report_dir" <<'PY'
          import sys
          from pathlib import Path

          report_paths = sorted(Path(sys.argv[1]).glob("*.json"))
          assert len(report_paths) == 1, report_paths
          print(report_paths[0])
          PY
          )"
          python -m sentinellite reports show "$ubuntu_report_path"

      - name: Validate v0.8 local notification summary export
        run: |
          report_dir=/tmp/sentinellite-v08-report
          notification_dir=/tmp/sentinellite-v08-notifications
          notification_path="$notification_dir/alert-summary.json"
          source_snapshot=/tmp/sentinellite-v08-source-before.bin
          rm -rf "$report_dir" "$notification_dir"
          mkdir -p "$notification_dir"

          python -m sentinellite scan-auth examples/auth_logs/sample_ubuntu_auth.log --output-dir "$report_dir"
          report_path="$(python - "$report_dir" <<'PY'
          import sys
          from pathlib import Path

          report_paths = sorted(Path(sys.argv[1]).glob("*.json"))
          assert len(report_paths) == 1, report_paths
          print(report_paths[0])
          PY
          )"

          python - "$report_path" "$source_snapshot" <<'PY'
          import sys
          from pathlib import Path

          report_path = Path(sys.argv[1])
          snapshot_path = Path(sys.argv[2])
          assert report_path.is_file()
          snapshot_path.write_bytes(report_path.read_bytes())
          PY

          python -m sentinellite reports export-notification "$report_path" --output "$notification_path"

          python - "$report_path" "$notification_path" "$source_snapshot" <<'PY'
          import json
          import sys
          from pathlib import Path

          report_path = Path(sys.argv[1])
          notification_path = Path(sys.argv[2])
          snapshot_path = Path(sys.argv[3])

          assert report_path.is_file()
          assert notification_path.is_file()
          source_bytes = report_path.read_bytes()
          assert source_bytes == snapshot_path.read_bytes()

          report = json.loads(source_bytes)
          notification_text = notification_path.read_text(encoding="utf-8")
          notification = json.loads(notification_text)
          assert set(report) == {
              "report_id",
              "report_type",
              "generated_at",
              "alert_count",
              "alerts",
          }
          assert "explanations" not in report
          assert set(notification) == {
              "schema_version",
              "output_type",
              "source",
              "alert_count",
              "included_alert_count",
              "omitted_alert_count",
              "severity_counts",
              "risk_level_counts",
              "alerts",
          }
          assert notification["schema_version"] == 1
          assert notification["output_type"] == "sentinellite_notification_summary"
          assert notification["source"] == {
              "report_id": report["report_id"],
              "generated_at": report["generated_at"],
          }
          assert notification["alert_count"] == 3
          assert notification["included_alert_count"] == 3
          assert notification["omitted_alert_count"] == 0
          assert len(notification["alerts"]) == 3
          for alert in report["alerts"]:
              assert alert["message"] not in notification_text
          assert '"message"' not in notification_text
          assert '"evidence"' not in notification_text
          assert '"explanation"' not in notification_text
          PY

          python -m sentinellite reports list --report-dir "$report_dir"
          python -m sentinellite reports show "$report_path"

      - name: Validate local report review commands
        run: |
          report_dir=/tmp/sentinellite-v06-reports
          invalid_report="$report_dir/invalid.json"
          rm -rf "$report_dir"

          python -m sentinellite scan-auth examples/auth_logs/sample_auth.log --output-dir "$report_dir"
          python -m sentinellite reports list --report-dir "$report_dir"

          report_path="$(python - "$report_dir" <<'PY'
          import sys
          from pathlib import Path

          reports = sorted(Path(sys.argv[1]).glob("*.json"))
          assert len(reports) == 1, reports
          print(reports[0])
          PY
          )"
          python -m sentinellite reports show "$report_path" | tee /tmp/sentinellite-v06-show.txt
          grep -Fq "SentinelLite Alert Report Summary" /tmp/sentinellite-v06-show.txt

          python - "$invalid_report" <<'PY'
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text('{"invalid":', encoding="utf-8")
          PY

          set +e
          python -m sentinellite reports list --report-dir "$report_dir" > /tmp/sentinellite-v06-mixed-list.txt 2>&1
          mixed_list_status=$?
          python -m sentinellite reports show "$invalid_report" > /tmp/sentinellite-v06-invalid-show.txt 2>&1
          invalid_show_status=$?
          set -e

          cat /tmp/sentinellite-v06-mixed-list.txt
          cat /tmp/sentinellite-v06-invalid-show.txt
          test "$mixed_list_status" -ne 0
          test "$invalid_show_status" -ne 0
          grep -Fq "Malformed JSON" /tmp/sentinellite-v06-mixed-list.txt
          grep -Fq "Malformed JSON" /tmp/sentinellite-v06-invalid-show.txt
          ! grep -Fq "Traceback" /tmp/sentinellite-v06-mixed-list.txt
          ! grep -Fq "Traceback" /tmp/sentinellite-v06-invalid-show.txt

      - name: Run authentication JSON explanation smoke test
        run: |
          smoke_dir=/tmp/sentinellite-json-explanation-smoke
          python -m sentinellite scan-auth examples/auth_logs/sample_auth.log --output-dir "$smoke_dir" --include-explanations
          python - "$smoke_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          report_paths = list(Path(sys.argv[1]).glob("*.json"))
          assert len(report_paths) == 1
          report = json.loads(report_paths[0].read_text(encoding="utf-8"))
          assert set(report) == {
              "report_id",
              "report_type",
              "generated_at",
              "alert_count",
              "alerts",
          }
          assert report["alerts"]
          assert all("explanation" in alert for alert in report["alerts"])
          assert "explanations" not in report
          PY

      - name: Validate config-driven JSON explanations
        run: |
          python - <<'PY'
          from pathlib import Path

          Path("/tmp/sentinellite-explanations.toml").write_text(
              """config_version = 1

          [reporting]
          output_dir = "/tmp/sentinellite-config-explanation-smoke"
          include_explanations = true
          """,
              encoding="utf-8",
          )
          PY
          python -m sentinellite --config /tmp/sentinellite-explanations.toml scan-auth examples/auth_logs/sample_auth.log
          python - <<'PY'
          import json
          from pathlib import Path

          report_paths = list(Path("/tmp/sentinellite-config-explanation-smoke").glob("*.json"))
          assert len(report_paths) == 1
          report = json.loads(report_paths[0].read_text(encoding="utf-8"))
          assert set(report) == {
              "report_id",
              "report_type",
              "generated_at",
              "alert_count",
              "alerts",
          }
          assert report["alerts"]
          assert all("explanation" in alert for alert in report["alerts"])
          assert "explanations" not in report
          PY

      - name: Validate disabled process module
        run: |
          python - <<'PY'
          from pathlib import Path

          Path("/tmp/sentinellite-process-disabled.toml").write_text(
              """config_version = 1

          [modules]
          process = false
          """,
              encoding="utf-8",
          )
          PY
          set +e
          python -m sentinellite --config /tmp/sentinellite-process-disabled.toml scan-process > /tmp/sentinellite-process-disabled.txt 2>&1
          status=$?
          set -e
          cat /tmp/sentinellite-process-disabled.txt
          test "$status" -ne 0
          grep -Fq "Process monitoring is disabled by configuration." /tmp/sentinellite-process-disabled.txt

      - name: Run process scan smoke test
        run: python -m sentinellite scan-process

      - name: Run network observation smoke test
        run: python -m sentinellite scan-network

      - name: Run file integrity observation smoke test
        run: python -m sentinellite scan-files README.md

      - name: Run file integrity baseline creation smoke test
        run: python -m sentinellite baseline-files README.md pyproject.toml --baseline-path file-integrity-baseline.json

      - name: Run file integrity baseline scan smoke test
        run: python -m sentinellite scan-files-baseline --baseline-path file-integrity-baseline.json
